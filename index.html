<!DOCTYPE html>
<html>
  <head>
    <title>Leaflet Multiple Point Layers</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
      #map {
        height: 500px;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <h2>Leaflet Map with Multiple Point Layers</h2>
    <div id="map"></div>

    <div id ="form">

        <h3>Submit Your Favorite Place</h3>
        <form action="/app" method="post">
            <label for="name">Place Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="type">Type of Place:</label><br>
            <select id="type" name="type" required>
                <option value="restaurant">Restaurant</option>
                <option value="poi">Point of Interest</option>
            </select><br><br>
            
            <button type="button" id="getlocation" onclick="getLocation()">Get my location</button>

            <input type="submit" value="Submit">
        </form>

    </div>

    <script>
       
       function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition);
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }
       
       // ---- Initialize Map ----
        const map = L.map('map').setView([19.067597, 72.870794], 13); 

        // ---- Basemap ----
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 19
        }).addTo(map);




        // ---- Load your GeoJSON layer ----
        fetch("Restaurantsfinalv3.geojson")
            .then(r => r.json())
            .then(data => {

                const restaurantsLayer = L.geoJSON(data, {
                    
                    // Red icons for restaurants

                    pointToLayer: (feature, latlng) => 
                        L.marker(latlng, {
                            icon: L.icon({
                                iconUrl: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
                                iconSize: [32, 32],
                                iconAnchor: [16, 32],
                                popupAnchor: [0, -32]
                            })
                        }),

                    onEachFeature: (f, l) => 
                        l.bindPopup(f.properties.Name || "Restaurant")
                });

                // Add layer to map
                restaurantsLayer.addTo(map);

                // Auto zoom to this layer
                map.fitBounds(restaurantsLayer.getBounds());

                // Layer control
                const overlays = {
                    "Restaurants": restaurantsLayer
                };

                L.control.layers(null, overlays).addTo(map);
            });

        fetch("PointOfInterestv2.geojson")
            .then(r => r.json())
            .then(data => {
                const poiLayer = L.geoJSON(data, {
                    onEachFeature: (f, l) => 
                        l.bindPopup(f.properties.Name || "Point of Interest")
                });

                // Add layer to map
                poiLayer.addTo(map);

                // Auto zoom to this layer
                map.fitBounds(poiLayer.getBounds());

                // Layer control
                const overlays = {
                    "Points of Interest": poiLayer
                };

                L.control.layers(null, overlays).addTo(map);
            });

        


    </script>


  </body>
</html>
